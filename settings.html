<div id="rpk_panel_root" class="roleplay-kernel-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Roleplay Kernel</b>
            <span id="rpk_header_status" class="rpk-header-status" data-state="offline">—</span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="rpk-section-title">Status</div>
            <div class="rpk-status-row">
                <span id="rpk_status" class="rpk-status">Not connected</span>
                <small id="rpk_version" class="rpk-details"></small>
            </div>
            <small id="rpk_details" class="rpk-details"></small>
            <div class="rpk-progress-card" aria-live="polite">
                <div class="rpk-progress-head">
                    <span id="rpk_progress_label" class="rpk-progress-label">Kernel idle</span>
                    <span id="rpk_progress_count" class="rpk-details">—</span>
                </div>
                <div id="rpk_progress" class="rpk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="rpk_progress_bar" class="rpk-progress-bar"></div>
                </div>
                <small id="rpk_progress_text" class="rpk-details">Ready</small>
            </div>
            <small id="rpk_runtime_status" class="rpk-details">Runtime: stopped</small>
            <div id="rpk_metrics" class="rpk-metrics" hidden>
                <span id="rpk_metrics_calls" class="rpk-metric">calls —</span>
                <span id="rpk_metrics_first" class="rpk-metric">first token —</span>
                <span id="rpk_metrics_total" class="rpk-metric">total —</span>
            </div>

            <div class="rpk-section-title">Runtime</div>
            <div class="rpk-actions">
                <button id="rpk_launch" class="menu-button primary"><i class="fa-solid fa-play"></i><span>Start</span></button>
                <button id="rpk_stop" class="menu-button"><i class="fa-solid fa-stop"></i><span>Stop</span></button>
                <button id="rpk_refresh" class="menu-button"><i class="fa-solid fa-rotate"></i><span>Refresh</span></button>
            </div>

            <div class="rpk-section-title">Connection</div>
            <label class="rpk-field">
                <span>ST profile</span>
                <select id="rpk_profile">
                    <option value="">Direct upstream from sidecar config</option>
                </select>
            </label>
            <small id="rpk_profile_hint" class="rpk-details"></small>
            <div class="rpk-actions">
                <button id="rpk_activate" class="menu-button primary"><i class="fa-solid fa-plug"></i><span>Activate</span></button>
                <button id="rpk_disable" class="menu-button"><i class="fa-solid fa-power-off"></i><span>Deactivate</span></button>
            </div>
            <label class="rpk-checkbox">
                <input id="rpk_auto_route" type="checkbox" />
                <span>Automatically route the Custom OpenAI source</span>
            </label>

            <div class="rpk-section-title">Settings</div>
            <label class="rpk-field">
                <span>Kernel mode</span>
                <select id="rpk_mode">
                    <option value="balanced">Balanced — full pipeline</option>
                    <option value="fast">Fast — render + state extraction</option>
                    <option value="lite">Lite — single render call</option>
                </select>
            </label>
            <label class="rpk-field">
                <span>Delay between requests, sec</span>
                <input id="rpk_request_delay" type="number" min="0" max="600" step="1" />
                <small class="rpk-details">Counted from the start of the previous response.</small>
            </label>

            <div class="rpk-section-title">Diagnostics</div>
            <div class="rpk-actions">
                <button id="rpk_self_test" class="menu-button"><i class="fa-solid fa-stethoscope"></i><span>Run self-test</span></button>
                <button id="rpk_diagnostics" class="menu-button"><i class="fa-solid fa-clipboard"></i><span>Copy diagnostics</span></button>
            </div>
            <div id="rpk_checks" class="rpk-checks" hidden></div>

            <div class="rpk-section-title">Actions</div>
            <div class="rpk-actions">
                <button id="rpk_approve" class="menu-button" disabled><i class="fa-solid fa-check"></i><span>Confirm delta</span></button>
                <button id="rpk_reject" class="menu-button" disabled><i class="fa-solid fa-xmark"></i><span>Reject delta</span></button>
                <button id="rpk_reset" class="menu-button danger"><i class="fa-solid fa-trash"></i><span>Reset session</span></button>
            </div>

            <details class="rpk-advanced">
                <summary>Technical details</summary>
                <label class="rpk-field">
                    <span>Sidecar URL</span>
                    <input id="rpk_sidecar_url" type="text" autocomplete="off" />
                </label>
                <label class="rpk-field">
                    <span>Integration key</span>
                    <input id="rpk_integration_key" type="password" autocomplete="new-password" />
                </label>
                <label class="rpk-field">
                    <span>Model ID</span>
                    <input id="rpk_model" type="text" autocomplete="off" readonly />
                    <small class="rpk-details">Local protocol identifier; the real model comes from the ST profile.</small>
                </label>
            </details>
        </div>
    </div>
</div>
