[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roleplay-kernel"
version = "0.6.1"
description = "Portable stateful runtime for API-driven roleplay generation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roleplay Kernel contributors" }]
dependencies = []

[project.scripts]
roleplay-kernel-sidecar = "roleplay_kernel.sidecar:_main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roleplay_kernel = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
