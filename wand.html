<div class="rpk-wand-entry">

        <span class="rpk-pill-dot" data-state="offline"></span>
        <span class="rpk-wand-label">Roleplay Kernel</span>
    </div>
    <div class="rpk-wand-detail" data-role="detail">idle</div>
    <div class="rpk-wand-progress">
        <div class="rpk-wand-bar" data-role="bar"></div>
